[workspace]
resolver = "3"
members = [
    "auto-login",
    "campus-core",
    "manager-gui",
    "manager-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
toml = "^0.9"
tokio = { version = "^1.41", features = ["rt-multi-thread", "macros", "signal", "process"] }
tokio-util = "^0.7.13"
fs4 = { version = "0.13", features = ["sync"] }
embed-resource = "3.0.5"
embed-manifest = "1.4.0"
serde = {version = "^1.0", default-features = false, features = ["derive"] }
anyhow = "1.0.99"
reqwest = {version = "^0.12", default-features = false, features = ["rustls-tls"]}
ipmb = "0.8.3"
thiserror = "2.0"

[profile.release]
opt-level = "z"
panic = "abort"